name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Test all Minecraft versions
        run: ./gradlew :1.21.11-fabric:test :26.1.2-fabric:test :26.2-fabric:test :26.3-fabric:test

      - name: Build runnable JARs
        run: ./gradlew :1.21.11-fabric:remapJar :26.1.2-fabric:jar :26.2-fabric:jar :26.3-fabric:jar

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: hoplite-tweaks
          path: build/libs/
