name: release

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish for Minecraft 1.21.11 only
        required: true
        type: string
        default: '1.3.4'

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'push'
    name: Validate Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag matches version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(grep '^mod\.version' stonecutter.properties.toml | cut -d'"' -f2)
          CHANNEL_TAG=$(grep '^mod\.channel_tag' stonecutter.properties.toml | cut -d'"' -f2)
          FULL_VERSION="${VERSION}${CHANNEL_TAG}"

          echo "Validating tag '$TAG' against version '$FULL_VERSION'..."
          if [[ "$TAG" != "$FULL_VERSION" ]]; then
            echo "::error::Tag '$TAG' does not match version '$FULL_VERSION' in gradle.properties."

            if gh release view "$TAG" &>/dev/null; then
              echo "Deleting GitHub release for $TAG..."
              gh release delete "$TAG" -y
            fi

            git push origin ":refs/tags/$TAG"
            exit 1
          fi
          echo "✓ Tag matches version."

  build:
    needs: validate
    uses: ./.github/workflows/build_reusable.yml
    with:
      release: true

  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    outputs:
      publish_github: ${{ steps.check.outputs.publish_github }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract approved release changelog
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"]
          text = Path("CHANGELOG.md").read_text()
          heading = f"## {version}\n"
          if heading not in text:
              raise SystemExit(f"Missing approved changelog for {version}")
          notes = text.split(heading, 1)[1].split("\n## ", 1)[0].strip()
          if not notes:
              raise SystemExit(f"Empty approved changelog for {version}")
          Path("CHANGELOG.md").write_text(notes + "\n")
          PYTHON

      - name: Check GitHub releases toggle
        id: check
        run: |
          if [[ "${{ vars.PUB_GITHUB_RELEASES }}" == "true" ]]; then
            echo "publish_github=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_github=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  github-release:
    name: Release to GitHub
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.publish_github == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "Creating or updating release for $TAG"
          # Try to create the release first
          if ! gh release create "$TAG" \
            --title "$TAG" \
            --notes-file CHANGELOG.md \
            --latest \
            --verify-tag \
            ./build/libs/$TAG/*; then

            echo "Release already exists. Updating existing release..."

            # Update release notes and mark as latest
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes-file CHANGELOG.md \
              --latest

            # Re-upload artifacts (delete first to avoid duplicates)
            for FILE in ./build/libs/$TAG/*; do
              NAME=$(basename "$FILE")
              gh release delete-asset "$TAG" "$NAME" -y || true
              gh release upload "$TAG" "$FILE" --clobber
            done
          fi

  platform-release:
    name: Release to Platforms
    runs-on: ubuntu-latest
    needs: prepare

    env:
      MOD_IS_RELEASE: true
      PUB_DRY_RUN: ${{ vars.PUB_DRY_RUN }}
      PUB_MODS_ENABLE: ${{ vars.PUB_MODS_ENABLE }}
      PUB_MAVEN_ENABLE: ${{ vars.PUB_MAVEN_ENABLE }}
      PUB_MAVEN_CENTRAL_ENABLE: ${{ vars.PUB_MAVEN_CENTRAL_ENABLE }}
      PUB_MAVEN_CENTRAL_SNAPSHOTS: ${{ vars.PUB_MAVEN_CENTRAL_SNAPSHOTS }}
      PUB_MODRINTH_STAGING: ${{ vars.PUB_MODRINTH_STAGING }}
      PUB_MODRINTH_PROJECT_ID: ${{ vars.PUB_MODRINTH_PROJECT_ID }}
      PUB_MODRINTH_TOKEN: ${{ secrets.PUB_MODRINTH_TOKEN }}
      PUB_SIGNING_KEY: ${{ secrets.PUB_SIGNING_KEY }}
      PUB_SIGNING_ID: ${{ secrets.PUB_SIGNING_ID }}
      PUB_SIGNING_PASSWORD: ${{ secrets.PUB_SIGNING_PASSWORD }}
      PUB_MAVEN_CENTRAL_USERNAME: ${{ secrets.PUB_MAVEN_CENTRAL_USERNAME }}
      PUB_MAVEN_CENTRAL_PASSWORD: ${{ secrets.PUB_MAVEN_CENTRAL_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 26
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Validate release JAR names
        run: |
          TAG="${GITHUB_REF_NAME}"
          MC_VERSIONS="1.21.11 26.1.2 26.2"
          if [[ "$TAG" == "1.3.3" ]]; then
            MC_VERSIONS="$MC_VERSIONS 26.3"
          fi
          for MC_VERSION in $MC_VERSIONS; do
            JAR="build/libs/${TAG}/hoplite_tweaks-${TAG}-fabric+${MC_VERSION}.jar"
            if [[ ! -f "$JAR" ]]; then
              echo "::error::Missing correctly named release JAR: $JAR"
              exit 1
            fi
          done

      # Keep these as separate steps so GitHub Actions cannot reorder or
      # parallelize platform uploads. Minecraft 26.3 requires separate,
      # explicit owner approval, granted for release 1.3.3.
      - name: Publish Minecraft 1.21.11 to Modrinth
        run: ./gradlew publish1.21.11 --no-parallel --stacktrace

      - name: Publish Minecraft 26.1.2 to Modrinth
        run: ./gradlew publish26.1.2 --no-parallel --stacktrace

      - name: Publish Minecraft 26.2 to Modrinth
        run: ./gradlew publish26.2 --no-parallel --stacktrace

      - name: Publish owner-approved Minecraft 26.3 to Modrinth
        if: github.ref_name == '1.3.3'
        run: ./gradlew publish26.3 --no-parallel --stacktrace

  single-version-release:
    name: Release Minecraft 1.21.11 only
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      MOD_IS_RELEASE: true
      PUB_DRY_RUN: ${{ vars.PUB_DRY_RUN }}
      PUB_MODS_ENABLE: ${{ vars.PUB_MODS_ENABLE }}
      PUB_MODRINTH_STAGING: ${{ vars.PUB_MODRINTH_STAGING }}
      PUB_MODRINTH_PROJECT_ID: ${{ vars.PUB_MODRINTH_PROJECT_ID }}

    steps:
      - name: Checkout existing release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 1

      - name: Validate tag and extract approved changelog
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          properties = Path("stonecutter.properties.toml").read_text()
          version = re.search(r'^mod\.version\s*=\s*"([^"]+)"', properties, re.M).group(1)
          channel = re.search(r'^mod\.channel_tag\s*=\s*"([^"]*)"', properties, re.M).group(1)
          if tag != version + channel:
              raise SystemExit("Release tag does not match the checked-in version")
          text = Path("CHANGELOG.md").read_text()
          heading = f"## {tag}\n"
          if heading not in text:
              raise SystemExit("Missing approved release changelog")
          notes = text.split(heading, 1)[1].split("\n## ", 1)[0].strip()
          if not notes:
              raise SystemExit("Empty approved release changelog")
          Path("CHANGELOG.md").write_text(notes + "\n")
          PYTHON

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 26
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Test Minecraft 1.21.11
        run: ./gradlew :1.21.11-fabric:test --no-daemon

      - name: Build runnable Minecraft 1.21.11 JAR
        run: ./gradlew :1.21.11-fabric:remapJar --no-daemon

      - name: Ensure Minecraft 1.21.11 has not already been published
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import urllib.request

          project = os.environ["PUB_MODRINTH_PROJECT_ID"]
          request = urllib.request.Request(
              f"https://api.modrinth.com/v2/project/{project}/version",
              headers={"User-Agent": "pheological/hoplite-tweaks release verification"})
          with urllib.request.urlopen(request, timeout=30) as response:
              versions = json.load(response)
          expected = os.environ["RELEASE_TAG"] + "-fabric+1.21.11"
          if any(version["version_number"] == expected for version in versions):
              raise SystemExit("Minecraft 1.21.11 is already published; refusing a duplicate upload")
          PYTHON

      - name: Publish Minecraft 1.21.11 to Modrinth
        env:
          PUB_MODRINTH_TOKEN: ${{ secrets.PUB_MODRINTH_TOKEN }}
        run: ./gradlew publish1.21.11 --no-parallel --stacktrace
